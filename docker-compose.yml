version: "3.8"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kids-ai-server
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://192.168.1.x:11434}
      - SECRET_KEY=${SECRET_KEY:-change-me-to-a-random-string}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
